# vim:set ft=tmux:
## name: Oasis Rose Light 5
## author: uhs-robert

# Main
set -ogq @thm_primary_strong "#802649"
set -ogq @thm_primary "#4e152c"
set -ogq @thm_primary_light "#471227"
set -ogq @thm_secondary "#224123"
set -ogq @thm_prefix "#266451"
