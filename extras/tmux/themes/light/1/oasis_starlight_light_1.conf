# vim:set ft=tmux:
## name: Oasis Starlight Light 1
## author: uhs-robert

# Main
set -ogq @thm_primary_strong "#1e75b1"
set -ogq @thm_primary "#064687"
set -ogq @thm_primary_light "#05407d"
set -ogq @thm_secondary "#786e14"
set -ogq @thm_prefix "#ab0707"
set -ogq @thm_fg "#1e1e14"

# Surfaces and overlays
set -ogq @thm_core "#faf9f5"
